name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

# media3 说明：
# media3 由本地 fork (minyoad/media) 导出为预编译 AAR 并随仓库提交（tv/libs/media3-*.aar），
# 构建无需再检出外部 media3 源码，本仓库完全自包含。

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出主仓库（含 media3 AAR）
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，确保能找到所有 tag

      # 2. 切换到指定 TAG
      - name: Checkout tag
        run: |
          # 确定目标 TAG
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "Target TAG: $TAG"

          # 切换到指定 TAG
          git fetch --tags --force
          git checkout "$TAG"

          echo "TAG=$TAG" >> $GITHUB_ENV

      # 3. 配置 JDK（21，与本地一致）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. 赋予 Gradle 可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 导入签名密钥
      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > release.keystore
          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PWD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PWD }}" >> $GITHUB_ENV

      # 6. 编译 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 7. 验证 APK 签名（自动选用 Runner 上最新的 build-tools）
      - name: Check APK signature
        run: |
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          echo "Using apksigner: $apksigner"
          find tv/build/outputs/apk/release -name '*.apk' | while read apk; do
            echo "🔍  Checking $apk"
            "$apksigner" verify --verbose "$apk"
            if [ $? -ne 0 ]; then exit 1; fi
          done

      # 8. 定位 APK 文件
      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find tv/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -z "$apk_path" ] && { echo "❌ APK not found"; exit 1; }
          echo "Found APK: $apk_path"
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT

      # 9. 检测是否为 Beta 版本
      - name: Check if Beta
        id: check_beta
        run: |
          if [[ "${{ env.TAG }}" == *"beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            echo "📢 Detected Beta release"
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      # 10. 发布到 GitHub Release (自动创建或更新)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ steps.check_beta.outputs.is_beta == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 触发更新 JSON 工作流
      - name: Trigger Update JSON Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_json.yml --ref main -f tag_name=${{ env.TAG }}
